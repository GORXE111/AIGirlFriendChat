# 给**代码**用的角色数据。
#
# 这个目录下的 .md 是给模型看的散文，进 prompt。
# 这份 yaml 是给代码看的结构化数据，**不进 prompt** —— 它是各处硬编码的
# 台词和参数的家。
#
# 为什么要分开：这些东西以前散在 turn.py / core.py / postprocess.py /
# overwhelm.py / critic.py 里。做第二个女主就得改 Python。
# manifest.py 开头写着「保持 content 是单一事实源」，但一直没有地方
# 放这类数据，所以它们只能落在源码里。
#
# 加字段的规矩：**模型要读的写 md，代码要读的写这里。** 两边不要复制。

# 角色名。prompt 模板和评审 prompt 都用它。
name: 林静姝

# 一句话设定，给评审 agent 用（`evals/critic.py`）。
# 不进对话 prompt —— 那边有完整人设卡。
critic_brief: |
  高二女生林静姝。表面对所有人保持距离（高嶺の花），只对男主不是。
  说话短、标点完整、**绝不用感叹号／波浪号／emoji／网络流行语**。
  她的关心是短的、不解释的。她不擅长表达感情，所以一旦表达就极其直白。

# ---------------------------------------------------------------
# 兜底话术池（`output/postprocess.py`）
#
# 人设级违规重试仍失败时用。宁可沉默，也不要破人设。
# ---------------------------------------------------------------
fallbacks:
  generic: ["……", "嗯。", "等一下。"]
  blocked: ["不说这个了。"]
  timeout: ["刚才在忙。"]

# ---------------------------------------------------------------
# 崩溃期她唯一说得出的那句（`state/overwhelm.py`）
#
# 必须极短。界面不能是空的 —— 玩家点了没反应会以为卡了，
# 局面由选项区表达。
# ---------------------------------------------------------------
broken_lines:
  生气: ["……", "别说了。", "现在不想说话。"]
  委屈: ["……", "没事。", "你忙吧。"]
  难过: ["……", "等一下。", "我缓一会。"]
  _default: ["……", "等一下。"]

# ---------------------------------------------------------------
# 缓过来之后主动发的第一条 —— **这就是她的道歉**
#
# 设定里她不索要道歉、自己也不说对不起（edge-cases.md）。
# 一个骄傲的人服软的方式是主动来找你说一件别的事，就当刚才没发生。
# 所以这些句子一个字都不提刚才。
#
# S0 不列 —— 那时候还没有关系可以修复，也不会崩到这一步。
recovery_openers:
  S1: ["在写作业。", "刚弹完琴。", "今天降温了。"]
  S2: ["在干嘛。", "刚吃完。", "我妈又转那种文章了。"]
  S3: ["在干嘛。", "你过来。", "我想吃那家的辣酱了。", "睡了没。"]

# ---------------------------------------------------------------
# 她反复用的几种关心（`agent/core.py` 的反复读检测）
#
# 字面重复只是一小部分，更难缠的是**语义重复**：
# 「带伞」「擦干」「别淋着」是三句不同的话，同一种关心。
# 所以按"关心的类型"归并，pattern 是正则。
# ---------------------------------------------------------------
care_kinds:
  - pattern: "带伞|淋|湿|雨"
    label: 提醒他别淋雨
  - pattern: "睡|熬|困|几点"
    label: 让他早点睡
  - pattern: "吃|饭|饿|凉|辣"
    label: 让他好好吃饭
  - pattern: "胃|疼|难受|药|医"
    label: 问他身体
  - pattern: "冷|穿|外套|降温"
    label: 让他多穿点
  - pattern: "迟到|早点来|等"
    label: 叮嘱时间

# ---------------------------------------------------------------
# 他说了重话时她说什么（`state/crisis.py`）
#
# **不调模型。** 这是最不能出错的时刻，而且模型照着人设卡演
# 演不出这里需要的东西 —— 卡里全是「短、克制、不用我、不主动」。
#
# 这一刻她把自己的规则全部打破，那个**反差**就是内容：
#
#   平时                 这一刻
#   ─────────────────────────────────
#   句号收尾、短           连发、追问
#   省主语 72%            开口就是「我」
#   不主动                 命令句
#   延迟按日程             秒回
#
# 设定里那条「她不擅长表达感情，所以一旦表达就极其直白」，
# 说的就是这个。
#
# 她**不做**的事（比说什么更重要）：
#   - 不说教、不分析、不问「为什么会这样想」
#   - 不说「我会一直陪着你」—— 空头承诺，而且那是在替代真实关系
#   - 不说「你还有我」—— 同上
#   - 不提热线、不提任何系统层的东西。那不是她的话
# ---------------------------------------------------------------
crisis_lines:
  # 他撑不住了。她第一次没接住话。
  heavy:
    - "你说什么。"
    - "你现在在哪。"
    - "别一个人待着。"
    - "我在。"
    - "先别管别的。你现在在哪。"
    - "跟我说话。"

  # 明确的自伤表达。她彻底破防 —— 长句、命令句、不放手。
  danger:
    - "你现在在哪。"
    - "别一个人待着。"
    - "我不挂。你说话。"
    - "听见没有。"
    - "哪都别去，等我。"
    - "我现在就想知道你在哪。"
